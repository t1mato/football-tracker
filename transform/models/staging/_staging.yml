version: 2

models:
  - name: stg_matches
    description: >
      One row per match. Status coerced to the accepted enum with the
      original preserved in status_raw. Date and hour derived from a naive
      UTC timestamp so they do not depend on the session timezone.
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: "{{ var('match_statuses') + ['UNKNOWN'] }}"
      - name: status_raw
        tests: [not_null]
      - name: kickoff_date_utc
        tests: [not_null]
      - name: kickoff_time_confirmed
        tests: [not_null]

  - name: stg_competitions
    columns:
      - name: competition_id
        tests: [unique, not_null]
      - name: competition_code
        tests: [unique, not_null]

  - name: stg_seasons
    columns:
      - name: season_id
        tests: [unique, not_null]

  - name: stg_teams
    columns:
      - name: team_id
        tests: [unique, not_null]
      - name: area_code
        tests: [not_null]

  - name: stg_players
    columns:
      - name: player_id
        tests: [unique, not_null]
      - name: team_id
        tests: [not_null]

  - name: stg_squad_observations
    tests:
      # Grain test only proves the combination is unique. NULLs group together,
      # so one all-NULL key column passes it -- hence not_null on each part.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [team_id, player_id, observed_date]
    columns:
      - name: team_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: observed_date
        tests: [not_null]

  - name: stg_standings
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [competition_code, season_id, team_id, snapshot_date]
    columns:
      - name: competition_code
        tests: [not_null]
      - name: season_id
        # iter_standings derives this from (payload.season or {}).get('id'),
        # which is None if the envelope ever omits season. Every row of that
        # snapshot would then share a NULL key, dlt's merge would collapse
        # them, and the grain test above would still pass.
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]
      - name: table_type
        # The grain deliberately excludes stage/type because that is the key
        # dlt merges on upstream. So if a competition ever returns a second
        # table for the same day -- HOME/AWAY alongside TOTAL, or a CL
        # playoff table beside the league phase -- the rows collapse before
        # they reach here and no test downstream can detect the loss. This
        # warns when that assumption breaks; the real fix is widening the
        # merge key in the dlt resource, which is Phase 1 work.
        tests:
          - accepted_values:
              arguments:
                values: ['TOTAL']
              config:
                severity: warn

  - name: stg_scorers
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [competition_code, season_id, player_id]
    columns:
      - name: competition_code
        tests: [not_null]
      - name: season_id
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: stg_venues
    columns:
      - name: venue_name
        tests: [unique, not_null]

  - name: stg_match_weather
    columns:
      - name: match_id
        tests: [unique, not_null]
      - name: data_type
        tests:
          - accepted_values:
              arguments:
                values: ['forecast', 'actual']


unit_tests:
  - name: coerces_a_defective_status_and_keeps_the_original
    description: >
      4 of 380 matches once returned a timestamp where the status enum
      belongs. The defect set moves as reschedules settle, so this pins the
      behaviour rather than the specific rows.
    model: stg_matches
    given:
      - input: source('raw', 'matches')
        rows:
          - {id: 1, status: 'FINISHED',             utc_date: '2024-05-01 14:00:00+00'}
          - {id: 2, status: '2026-09-05 13:15:00Z', utc_date: '2026-09-05 14:15:00+00'}
    expect:
      rows:
        - {match_id: 1, status: 'FINISHED', status_raw: 'FINISHED'}
        - {match_id: 2, status: 'UNKNOWN',  status_raw: '2026-09-05 13:15:00Z'}

  - name: awarded_is_a_valid_status_not_a_defect
    model: stg_matches
    given:
      - input: source('raw', 'matches')
        rows:
          - {id: 1, status: 'AWARDED', utc_date: '2024-05-01 14:00:00+00'}
    expect:
      rows:
        - {match_id: 1, status: 'AWARDED', status_raw: 'AWARDED'}

  - name: an_unconfirmed_kickoff_has_no_hour
    description: >
      Every SCHEDULED match sits at exactly 00:00:00Z -- the source saying
      the time is not confirmed. Emitting hour 0 would give a 19:00 fixture
      midnight weather, silently.
    model: stg_matches
    given:
      - input: source('raw', 'matches')
        rows:
          - {id: 1, status: 'SCHEDULED', utc_date: '2026-10-01 00:00:00+00'}
          - {id: 2, status: 'TIMED',     utc_date: '2026-10-01 19:00:00+00'}
    expect:
      rows:
        - {match_id: 1, kickoff_hour_utc: null, kickoff_time_confirmed: false}
        - {match_id: 2, kickoff_hour_utc: 19,   kickoff_time_confirmed: true}

  - name: the_utc_date_does_not_follow_the_session_timezone
    description: >
      A 00:30Z instant is the previous day under any US session. Deriving
      the date from the naive UTC form is what keeps it on 2023-08-12.
    model: stg_matches
    given:
      - input: source('raw', 'matches')
        rows:
          - {id: 1, status: 'FINISHED', utc_date: '2023-08-12 00:30:00+00'}
    expect:
      rows:
        - {match_id: 1, kickoff_date_utc: '2023-08-12', kickoff_hour_utc: 0}
