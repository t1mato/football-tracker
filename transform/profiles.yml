football_tracker:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative to the PROCESS working directory, not to this file -- duckdb
      # gets the string as-is. Every Makefile target cds into transform/ first,
      # so it resolves correctly today. It will not if something runs dbt from
      # the repo root with --profiles-dir transform (a Dagster DbtCliResource
      # passes project_dir and profiles_dir explicitly): dbt would silently
      # create a new empty database one level up and build against it, with no
      # error. Revisit when Phase 3 lands and the invocation is known.
      path: ../football_data.duckdb
      threads: 4
      # Load-bearing, not cosmetic. Verified: without this block dbt-duckdb
      # inherits the machine timezone (America/Los_Angeles here) and
      # cast(timestamptz as date) returns 2023-08-11 for a 2023-08-12
      # instant. Verified to apply on every connection in the pool.
      settings:
        TimeZone: 'UTC'
    ci:
      type: duckdb
      path: ci.duckdb
      threads: 4
      settings:
        TimeZone: 'UTC'
    # Deliberately NOT UTC. `make tz-check` runs the unit tests against this
    # target: any model deriving a date or hour from a timestamptz instead of
    # the naive UTC form returns a different answer here than under `make
    # test`, and fails. Verified: with to_utc_naive stubbed out, a 00:30Z
    # kickoff comes back as 2023-08-11 hour 17 instead of 2023-08-12 hour 0.
    #
    # It shares ci.duckdb because unit tests introspect the source relation
    # for column types and so need raw.* to exist -- create_empty_sources
    # already builds them there. It must never point at football_data.duckdb.
    tz_probe:
      type: duckdb
      path: ci.duckdb
      threads: 1
      settings:
        TimeZone: 'America/Los_Angeles'
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: main
      location: US
      threads: 4
      maximum_bytes_billed: 1000000000  # 1 GB -- this project's whole warehouse is a handful of small tables; anything scanning more than this is a runaway query, not a real workload.
