name: football_analytics
version: '1.0.0'
config-version: 2

# A distinctive profile name is a safety mechanism. `dbt --project-dir
# transform` run from the repo root finds the project via the flag but
# resolves profiles from ~/.dbt/ -- with a generic name it could silently
# connect to another warehouse with an unpinned session. With this name it
# fails: "Could not find profile named 'football_tracker'".
profile: football_tracker

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # The only copy of this list. Referenced by stg_matches' CASE and by the
  # accepted_values test in _sources.yml (schema files are Jinja-rendered).
  # Two copies would drift, and the day they drift you get a contradictory
  # pair of test results instead of one answer.
  match_statuses:
    - SCHEDULED
    - TIMED
    - IN_PLAY
    - PAUSED
    - FINISHED
    - POSTPONED
    - SUSPENDED
    - CANCELLED
    - AWARDED

  # dbt_utils.date_spine's end_date is EXCLUSIVE (verified 2026-09-04: a
  # spine from 2020-01-01 to 2020-01-06 returns 5 rows, through 01-05, not
  # 01-06). end is therefore one day past the last day the spine should
  # actually contain.
  date_spine_start: '2020-01-01'
  date_spine_end_exclusive: '2031-01-01'

  # Domestic leagues are entirely REGULAR_SEASON -- no knockout stage
  # exists there at all. CL alone needs this: GROUP_STAGE (2023/24) and
  # LEAGUE_STAGE (2024/25+) both have a real table to rank a position
  # within; LAST_16/QUARTER_FINALS/SEMI_FINALS/FINAL do not -- matchday
  # resets to 1-2 every knockout round (verified 2026-09-04), so there is
  # no "position after matchday N" to compute there at all.
  standings_phase_stages:
    - REGULAR_SEASON
    - GROUP_STAGE
    - LEAGUE_STAGE

models:
  football_analytics:
    staging:
      +materialized: view
    marts:
      # All ten models in this phase are full-rebuild tables. dlt already
      # solved incremental correctness at the raw layer (matches merges on
      # id, standings merges on a key that includes snapshot_date so history
      # accumulates), so recomputing from staging on every run is always
      # correct and there is no dbt-layer merge/unique_key to reason about.
      +materialized: table
