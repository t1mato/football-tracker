main:
  params: [input]
  steps:
    - init:
        # Workflows' ${...} expression language has no map/object literal syntax, so a
        # default like ${default(map.get(input, "key"), {})} is illegal -- {} can only
        # appear in plain YAML. Defaults are plain YAML maps instead, optionally
        # overwritten below by the switch steps. transform_weather_overrides' default
        # IS the override (args: ["transform-weather"]) -- without it, the second
        # transform call would just re-run the star-schema build again.
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "us-central1"
          - ingest_overrides:
              containerOverrides: []
          - transform_overrides:
              containerOverrides: []
          - weather_overrides:
              containerOverrides: []
          - transform_weather_overrides:
              containerOverrides:
                - args: ["transform-weather"]
    - maybe_override_ingest:
        switch:
          - condition: ${"ingest_overrides" in input}
            assign:
              - ingest_overrides: ${input.ingest_overrides}
    - maybe_override_transform:
        switch:
          - condition: ${"transform_overrides" in input}
            assign:
              - transform_overrides: ${input.transform_overrides}
    - maybe_override_weather:
        switch:
          - condition: ${"weather_overrides" in input}
            assign:
              - weather_overrides: ${input.weather_overrides}
    - maybe_override_transform_weather:
        switch:
          - condition: ${"transform_weather_overrides" in input}
            assign:
              - transform_weather_overrides: ${input.transform_weather_overrides}
    # googleapis.run.v2...jobs.run raises its own OperationError when a single-task job
    # execution fails, before run_ingest/run_transform/run_weather even return -- the
    # check_* steps below never see that case fire. They're defense-in-depth for a
    # hypothetical multi-task job, not the mechanism catching today's failures.
    - run_ingest:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/ingest"}
          body:
            overrides: ${ingest_overrides}
        result: ingest_execution
    - check_ingest:
        switch:
          - condition: ${default(map.get(ingest_execution, "failedCount"), 0) > 0}
            # Single-quoted: the literal ": " inside this string is otherwise ambiguous
            # with YAML's own key/value separator.
            raise: '${"ingest job execution failed: " + ingest_execution.name}'
    - run_transform:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/transform"}
          body:
            overrides: ${transform_overrides}
        result: transform_execution
    - check_transform:
        switch:
          - condition: ${default(map.get(transform_execution, "failedCount"), 0) > 0}
            raise: '${"transform job execution failed: " + transform_execution.name}'
    - run_weather:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/weather"}
          body:
            overrides: ${weather_overrides}
        result: weather_execution
    - check_weather:
        switch:
          - condition: ${default(map.get(weather_execution, "failedCount"), 0) > 0}
            raise: '${"weather job execution failed: " + weather_execution.name}'
    - run_transform_weather:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/transform"}
          body:
            overrides: ${transform_weather_overrides}
        result: transform_weather_execution
    - check_transform_weather:
        switch:
          - condition: ${default(map.get(transform_weather_execution, "failedCount"), 0) > 0}
            raise: '${"transform-weather job execution failed: " + transform_weather_execution.name}'
    - finish:
        return: "nightly pipeline succeeded"
