main:
  params: [input]
  steps:
    - init:
        assign:
          - project_id: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - region: "us-central1"
          - ingest_overrides:
              containerOverrides: []
          - transform_overrides:
              containerOverrides: []
    - maybe_override_ingest:
        switch:
          - condition: ${"ingest_overrides" in input}
            assign:
              - ingest_overrides: ${input.ingest_overrides}
    - maybe_override_transform:
        switch:
          - condition: ${"transform_overrides" in input}
            assign:
              - transform_overrides: ${input.transform_overrides}
    - run_ingest:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/ingest"}
          body:
            overrides: ${ingest_overrides}
        result: ingest_execution
    - check_ingest:
        switch:
          - condition: ${default(map.get(ingest_execution, "failedCount"), 0) > 0}
            raise: '${"ingest job execution failed: " + ingest_execution.name}'
    - run_transform:
        call: googleapis.run.v2.projects.locations.jobs.run
        args:
          name: ${"projects/" + project_id + "/locations/" + region + "/jobs/transform"}
          body:
            overrides: ${transform_overrides}
        result: transform_execution
    - check_transform:
        switch:
          - condition: ${default(map.get(transform_execution, "failedCount"), 0) > 0}
            raise: '${"transform job execution failed: " + transform_execution.name}'
    - finish:
        return: "nightly pipeline succeeded"
