name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"

      # Bare `uv sync` drops the dev extras (pytest/ruff/mypy/bandit) --
      # --all-extras is required, not optional.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Ruff
        run: .venv/bin/ruff check .

      - name: Mypy
        run: .venv/bin/mypy

      # Scoped to this project's actual first-party source -- transform/
      # is SQL/YAML, not Python, and scratch/ is already excluded via
      # pyproject.toml's [tool.bandit] config.
      - name: Bandit
        run: .venv/bin/bandit -c pyproject.toml -r app football_pipeline orchestration

      - name: Pytest
        run: .venv/bin/pytest

      # dbt build against empty sources (proves the DAG builds and unit
      # tests pass without ever calling football-data.org) plus the
      # timezone-independence check -- no live API, no secrets needed.
      - name: dbt build + tz-check
        run: make ci
