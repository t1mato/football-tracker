[project]
name = "football-pipeline"
version = "0.1.0"
description = "Batch ELT pipeline and analytics app for European football data"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Split so the pipeline image (Dockerfile) and the app image
# (Dockerfile.app) can each install only what they run -- neither has ever
# needed the other's half. `uv sync --all-extras` (CI, local dev) still
# installs both plus dev, unchanged.
pipeline = [
    "dagster>=1.11.9",
    "dagster-webserver>=1.11.9",
    # <2: nothing else currently constrains this away from a pre-release
    # major version (verified: bare >=1.12 resolved to dbt-core 2.0.0rc1,
    # which breaks unit-test type-checking on this project's TIMESTAMPTZ
    # columns). Pin below 2 regardless of what else is in this list.
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11",
    # Same resolver hazard as dbt-core above -- pin below 2 regardless.
    "dbt-bigquery>=1.12,<2",
    "dlt[duckdb,bigquery]>=1.30",
    "requests>=2.32",
]
app = [
    "streamlit>=1.63.0",
    # The four floors below are the exact versions already resolved in
    # this repo's lockfile before this split -- app/queries.py already
    # imports all four directly, but only got them transitively through
    # dlt/dbt until now.
    "google-cloud-bigquery>=3.45.0",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "duckdb>=1.5.5",
    # app/pages/team_profile.py imports this directly for its form-guide chart.
    "altair>=6.2.2",
    # google.cloud.bigquery.QueryJob.to_dataframe() raises ValueError without
    # this at call time, not import time -- CI's mocked BigQueryConnection
    # tests never exercise a real to_dataframe() call, so this gap was only
    # caught live (Task 5's real Cloud Run deploy). Version matches what
    # dlt[bigquery] already resolves transitively for the pipeline extra.
    "db-dtypes>=1.7.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "responses>=0.25",
    "types-requests",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["football_pipeline", "warehouse"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "scratch"]
