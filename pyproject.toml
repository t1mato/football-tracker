[project]
name = "football-pipeline"
version = "0.1.0"
description = "Batch ELT pipeline and analytics app for European football data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dagster>=1.11.9",
    "dagster-webserver>=1.11.9",
    # <2: nothing else currently constrains this away from a pre-release
    # major version (verified: bare >=1.12 resolved to dbt-core 2.0.0rc1,
    # which breaks unit-test type-checking on this project's TIMESTAMPTZ
    # columns). Pin below 2 regardless of what else is in this list.
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11",
    "dlt[duckdb]>=1.30",
    "requests>=2.32",
    "streamlit>=1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "responses>=0.25",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["football_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["football_pipeline"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "scratch"]
